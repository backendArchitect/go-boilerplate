name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The same command developers and agents run locally. It starts Postgres
      # with Docker Compose, regenerates code, tidies, lints, scans and tests.
      - run: make check
      - name: Generated code and go.mod are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::make check changed files; run it locally and commit the result"
            git status --short && git diff
            exit 1
          fi

  # gospect bug scan: fails on high-severity findings and uploads every finding
  # as SARIF, so they show up as annotations on the PR diff and in the Security
  # tab. Same version and gate as `make scan`; bump both together.
  gospect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload
    steps:
      - uses: actions/checkout@v7
      - uses: backendArchitect/gospect-mcp@v1.1.38
        with:
          version: v1.1.38
          fail-on: high
          # PRs from forks get a read-only token, so skip the upload there
          # (the gate still runs).
          sarif: ${{ !github.event.pull_request.head.repo.fork }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t go-boilerplate .
