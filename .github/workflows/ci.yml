name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The same command developers and agents run locally. It starts Postgres
      # with Docker Compose, regenerates code, tidies, lints and tests.
      - run: make check
      - name: Generated code and go.mod are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::make check changed files; run it locally and commit the result"
            git status --short && git diff
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t go-boilerplate .
