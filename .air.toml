# Live reload for `make dev`. See https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/app ."
entrypoint = ["./tmp/app", "api"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", ".git"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "5s"

[misc]
clean_on_exit = true
